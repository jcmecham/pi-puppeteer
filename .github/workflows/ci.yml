name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    # The storage migration turns on the difference between EXDEV and EPERM/EBUSY, and file locking
    # behaves differently on Windows, so both platforms run the checks.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run validate

      - name: Check publish bundle
        run: npm pack --dry-run
